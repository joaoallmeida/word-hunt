<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caça-Palavras | Word Hunt</title>
    <link rel="icon" href="assets/images/puzzle_icon.png" type="image/png" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="theme-toggle">
      <button id="toggle-theme" aria-label="Alternar modo escuro/claro">
        ☀️
      </button>
    </div>

    <div class="container">
      <!-- Start Page Card -->
      <div id="start-screen" class="start-card">
        <div class="start-logo">
          <h1 class="start-title">🧩 Caça-Palavras</h1>
          <p class="start-subtitle">Desafie sua mente, encontre as palavras escondidas</p>
        </div>
        <div class="best-time-container">
          <p class="best-time-text">🏆 Melhor Tempo: <strong id="best-time-display">--:--</strong></p>
        </div>
        
        <div class="start-settings">
          <div class="start-settings-container">
            <div class="setting-group">
              <label for="difficulty-select" class="settings-label">Nível de Dificuldade:</label>
              <select id="difficulty-select" class="form-select">
                <option value="easy">Fácil</option>
                <option value="medium" selected>Médio</option>
                <option value="hard">Difícil</option>
              </select>
            </div>
            <div class="setting-group">
              <label for="theme-select" class="settings-label">Tema:</label>
              <select id="theme-select" class="form-select">
                <option value="random" selected>Aleatório</option>
                <option value="animais">Animais</option>
                <option value="paises">Países</option>
                <option value="alimentos">Alimentos</option>
                <option value="tecnologia">Tecnologia</option>
              </select>
            </div>
          </div>
        </div>

        <div class="start-actions">
          <button id="init-game" class="btn btn-primary btn-lg flex-center" aria-label="Iniciar jogo">
            <img src="assets/images/play_icon.png" alt="Icon" width="28" height="28">
            <span>Jogar Agora</span>
          </button>
          <button id="start-instructions-btn" class="btn btn-secondary btn-lg flex-center" aria-label="Instruções">
            <img src="assets/images/hint_icon.png" alt="Icon" width="28" height="28">
            <span>Como Jogar</span>
          </button>
        </div>
      </div>

      <!-- Game Screen (Hidden initially) -->
      <div id="game-screen" class="hidden game-screen-container">
        <!-- Header/Navigation -->
        <header class="header game-header">
          <div class="header-content">
            <div class="logo-section">
              <h1 class="title">🧩 Caça-Palavras</h1>
            </div>
          </div>
        </header>

        <!-- Game Controls -->
        <div class="top-bar">
          <div class="controls">
            <button id="instructions-button" class="btn btn-secondary flex-center" aria-label="Instruções">
              <img src="assets/images/hint_icon.png" alt="Icon" width="24" height="24">
              <span>Instruções</span>
            </button>
            <button id="new-game" class="btn btn-secondary flex-center" aria-label="Novo jogo">
              <img src="assets/images/plus_icon.png" alt="Icon" width="24" height="24">
              <span>Novo Jogo</span>
            </button>
            <button id="hint-button" class="btn btn-secondary flex-center" aria-label="Dica">
              <img src="assets/images/hint_icon.png" alt="Icon" width="24" height="24">
              <span>Dica</span>
            </button>
            <button id="timer" class="btn btn-timer flex-center" aria-label="Cronômetro">
              <img src="assets/images/clock_icon.png" alt="Icon" width="24" height="24">
              <span>00:00</span>
            </button>
          </div>
        </div>

        <!-- Word List -->
        <div class="word-container" aria-label="Lista de palavras">
          <div class="word-container-header">
            <h2>Palavras Para Encontrar</h2>
          </div>
          <div id="word-table"></div>
        </div>

        <!-- Game Board -->
        <div class="game-board-container" aria-label="Tabuleiro do jogo">
          <div id="game-board" role="grid"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/scripts/game.js" defer></script>
  </body>
</html>
